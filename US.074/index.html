<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spool viewer</title>
<style>
:root{--bg:#eef1f4;--paper:#fff;--ink:#17202b;--muted:#5d6977;--line:#d5dbe2;--steel:#24486c;--oxide:#b1532c;--ok:#2f7d4f;--warn:#b7791f;--bad:#c8102e}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--paper:#161d25;--ink:#e2e8ee;--muted:#98a5b3;--line:#2a3541;--steel:#8db3d9;--oxide:#e07a4a;--ok:#5fbf85;--warn:#e0a94a;--bad:#f06b7f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
header{background:var(--steel);color:#fff;padding:14px 16px 12px}@media (prefers-color-scheme:dark){header{color:#0f141a}}
header .p{font-size:13px;opacity:.9}h1{font:700 32px/1.1 ui-monospace,Consolas,monospace;margin:4px 0 2px}header .s{font-size:14px}
.lang{float:right;background:transparent;border:1px solid currentColor;color:inherit;padding:5px 12px;border-radius:4px;font:inherit;font-size:13px;min-height:36px}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}section{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 12px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}dt{color:var(--muted);font-size:13px}dd{margin:0;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 5px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px}td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}.bars{display:grid;gap:9px}.bar b{float:right;font-variant-numeric:tabular-nums}.tr{height:9px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}.fl{height:100%;background:var(--ok)}
.cv{position:relative;overflow:auto;touch-action:manipulation;border:1px solid var(--line);max-height:70vh}.sh{position:relative;width:100%}.sh img{display:block;width:100%;height:auto}
.mk{position:absolute;width:6%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #e8821e;border-radius:50%;pointer-events:none}.mk.sp{width:9.5%;border:3px solid #c8102e}.mk.done{border-color:#2f7d4f}.sh.full .mk{width:3.6%}.sh.full .mk.sp{width:4.8%}
.zb{display:flex;gap:8px;margin:8px 0 0}.zb button{min-height:42px;min-width:48px;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.pl{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}.OK{background:#d7efe0;color:#1f6a40}.PARTIAL,.REVIEW{background:#fbecc9;color:#855c10}.MISSING,.NOT_IN_MTO{background:#fadadd;color:#a30d26}.VALVE{background:var(--line);color:var(--ink)}
.tabs button{min-height:40px;margin:0 6px 6px 0;font:inherit;padding:0 12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px}.tabs button[aria-pressed=true]{background:var(--steel);color:#fff}
.q{width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}.l a{display:block;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-family:ui-monospace,monospace}.note{color:var(--muted);font-size:13px;margin:6px 0 0}
</style></head><body><div id="app"><main><section>Loading…</section></main></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let lang='en';try{lang=localStorage.getItem('lang')==='es'?'es':'en'}catch(e){}
const q0=new URLSearchParams(location.search).get('lang');if(q0)lang=q0==='es'?'es':'en';
const T={en:{prog:'Progress',asof:'Progress as of',sys:'System',iso:'Isometric',sheet:'Sheet',rev:'Rev.',line:'Line',svc:'Service',dia:'Diameter',sch:'SCH',mat:'Material',joints:'Joints',jt:'Joint',ty:'Type',st:'Status',done:'Welded',fit:'Fitted',pend:'Pending',bom:'Fabrication material',qty:'Qty',desc:'Description',size:'Size',cut:'Pipe cut list',piece:'Piece',len:'Length (mm)',rem:'Remarks',loose:'Loose material (erection)',title:'Title block',srch:'Search spool…',matSt:'Material status',ms:{1:'Can fabricate 100%',2:'Partial start',3:'Cannot start',0:'No shop material'},st2:{OK:'OK',PARTIAL:'Partial',MISSING:'Missing',REVIEW:'To review',NOT_IN_MTO:'Not in MTO',VALVE:'Separate supply'},cls:'Piping class',op:'Operating P / T',ds:'Design P / T',ts:'Test P / medium',ndt:'NDT RT / LT-MT',paint:'Paint',ins:'Insulation',pwht:'PWHT',pid:'P&ID',fw:'F&W',bp:'B&P',pp:'P&P',rts:'RTS',nf:'Spool not found',spools:'spools',sup:'Supports',inch:'Inch-dia',sf:'Surface'},
es:{prog:'Avance',asof:'Avance al',sys:'Sistema',iso:'Isométrico',sheet:'Hoja',rev:'Rev.',line:'Línea',svc:'Servicio',dia:'Diámetro',sch:'SCH',mat:'Material',joints:'Juntas',jt:'Junta',ty:'Tipo',st:'Estado',done:'Soldada',fit:'Armada',pend:'Pendiente',bom:'Material de fabricación',qty:'Cant.',desc:'Descripción',size:'Medida',cut:'Lista de corte',piece:'Pieza',len:'Largo (mm)',rem:'Notas',loose:'Material suelto (montaje)',title:'Cuadro de títulos',srch:'Buscar spool…',matSt:'Estado de material',ms:{1:'100% fabricable',2:'Avance parcial',3:'No iniciar',0:'Sin material de taller'},st2:{OK:'OK',PARTIAL:'Parcial',MISSING:'Falta',REVIEW:'Por revisar',NOT_IN_MTO:'No está en MTO',VALVE:'Suministro aparte'},cls:'Clase',op:'Operación P / T',ds:'Diseño P / T',ts:'Prueba P / medio',ndt:'NDT RT / LT-MT',paint:'Pintura',ins:'Aislamiento',pwht:'PWHT',pid:'P&ID',fw:'F&W',bp:'B&P',pp:'P&P',rts:'RTS',nf:'No se encontró el spool',spools:'spools',sup:'Soportes',inch:'Pulg-diám',sf:'Superficie'}};
const t=k=>T[lang][k],esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmtD=d=>d?d.slice(5,7)+'/'+d.slice(8,10)+'/'+d.slice(0,4):'';
const J=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
let I,A,cur=null,sel=0,sheets={};
async function boot(){try{[I,A]=await Promise.all([J('a/index.json'),J('a/avance.json')]);}catch(e){app.innerHTML='<main><section>Could not load data.</section></main>';return}document.title=I.code+' · '+(I.name||'Spools');route();addEventListener('hashchange',route);}
function parseHash(){const h=location.hash.slice(1);if(!h)return '';const p=decodeURIComponent(h.replace(/\+/g,' ')).split('~');return (p[1]||p[0]||'').toUpperCase();}
async function route(){const sp=parseHash();if(!sp)return index();const r=I.spools.find(x=>x.sp===sp);if(!r){app.innerHTML=`<main><section>${t('nf')}: ${esc(sp)}</section></main>`;return}cur=r;sel=0;await card();}
function index(){app.innerHTML=`<header><button class="lang" id="L">${lang==='en'?'ES':'EN'}</button><div class="p">${esc(I.code)}</div><div class="s" style="font-size:20px;font-weight:700">${esc(I.name||'')}</div></header><main><section><input class="q" id="q" placeholder="${t('srch')}"><div class="l" id="l"></div></section></main>`;$('#L').onclick=tog;const d=()=>{const v=$('#q').value.trim().toUpperCase();$('#l').innerHTML=I.spools.filter(x=>!v||x.sp.includes(v)||x.tag.toUpperCase().includes(v)).slice(0,60).map(x=>`<a href="#${encodeURIComponent(x.tag)}~${encodeURIComponent(x.sp)}~~1-1">${esc(x.sp)} · ${esc(x.area)}</a>`).join('')};$('#q').oninput=d;d();}
const tog=()=>{lang=lang==='en'?'es':'en';try{localStorage.setItem('lang',lang)}catch(e){}route()};
async function loadSheet(id){if(sheets[id])return sheets[id];const p=await J(`a/pack_${I.packOf[id]}.json`);Object.assign(sheets,p);return sheets[id];}
function jr(j){return (A.J||{})[j]||null}
async function card(){const r=cur,id=r.sh[sel],s=await loadSheet(id),st=(A.ST||{})[id]||[0,'',[]];
 const myJ=s.j.filter(j=>{const x=jr(j);return x&&x[6]===r.sp});const noMap=s.sp.length===1?s.j.filter(j=>!jr(j)):[];const js=[...myJ,...noMap];
 const counted=myJ.filter(j=>!jr(j)[3]);const pd=counted.reduce((a,j)=>a+jr(j)[4],0),fw=counted.filter(j=>jr(j)[1]).reduce((a,j)=>a+jr(j)[4],0);
 const pp=(A.P||{})[r.sp]||['','','',''],pct=pd?fw/pd:0;
 const bar=(n,on,sub,ratio)=>`<div class="bar"><span>${n}</span><b>${on?(sub||'✓'):'—'}</b><div class="tr"><div class="fl" style="width:${(ratio??(on?1:0))*100}%"></div></div></div>`;
 const mk=(s.mk||[]).filter(m=>m[0]===r.sp||js.includes(m[0])).map(m=>{const x=jr(m[0]);return `<span class="mk ${m[0]===r.sp?'sp':''} ${x&&x[1]?'done':''}" style="left:${m[1]*100}%;top:${m[2]*100}%"></span>`}).join('');
 const tb=s.tb||{};const rows=[[t('cls'),tb.cls],[t('op'),[tb.opP,tb.opT].filter(Boolean).join(' '+(tb.pu||'bar')+' / ')+(tb.opT?' °C':'')],[t('ds'),[tb.dsP,tb.dsT].filter(Boolean).join(' '+(tb.pu||'bar')+' / ')+(tb.dsT?' °C':'')],[t('ts'),[tb.tsP,tb.med].filter(Boolean).join(' '+(tb.pu||'bar')+' / ')],[t('ndt'),[tb.rt,tb.mt].filter(Boolean).join(' / ')],[t('paint'),tb.paint],[t('ins'),tb.ins],[t('pwht'),tb.pwht],[t('pid'),tb.pid]].filter(x=>x[1]);
 const sheetsTabs=r.sh.length>1?`<div class="tabs">${r.sh.map((x,i)=>`<button data-s="${i}" aria-pressed="${i===sel}">${t('sheet')} ${i+1}</button>`).join('')}</div>`:'';
 app.innerHTML=`<header><button class="lang" id="L">${lang==='en'?'ES':'EN'}</button><div class="p">${esc(I.code)}${I.name?' · '+esc(I.name):''}</div><h1>${esc(r.sp)}</h1><div class="s">${esc(r.sys)}</div><div class="s" style="font-family:ui-monospace,monospace;font-size:13px;overflow-wrap:anywhere">${esc(s.dwg)}</div></header><main>
 <section><h2>${t('asof')} ${fmtD(A.asof)}</h2><div class="bars">${bar(t('fw'),fw>0,Math.round(pct*100)+'%',pct)}${bar(t('bp'),!!pp[1],fmtD(pp[1]))}${bar(t('pp'),!!pp[2],fmtD(pp[2]))}${bar(t('rts'),!!pp[3],fmtD(pp[3]))}</div></section>
 <section><dl><dt>${t('iso')}</dt><dd>${esc(s.full||s.dwg)}</dd><dt>${t('sheet')} / ${t('rev')}</dt><dd>${esc(s.shN||'—')}${s.shOf?' of '+esc(s.shOf):''} · ${esc(s.rv)}</dd><dt>${t('line')}</dt><dd>${esc(s.line)}</dd><dt>${t('svc')}</dt><dd>${esc(s.svc)}</dd><dt>${t('dia')}</dt><dd>${esc(r.dia)}"</dd><dt>${t('sch')}</dt><dd>${esc(r.sch)}</dd><dt>${t('mat')}</dt><dd>${esc(r.mat)}</dd><dt>${t('inch')}</dt><dd>${esc(r.pd)}</dd><dt>${t('matSt')}</dt><dd>${t('ms')[st[0]]||''}</dd></dl></section>
 <section>${sheetsTabs}<h2>${t('iso')}</h2><div class="cv" id="cv"><div class="sh ${s.full0?'full':''}" id="sh">${s.img?`<img src="${s.img}" alt="${esc(s.dwg)}">`:''}${mk}</div></div><div class="zb"><button id="zo" aria-label="-">−</button><button id="zi" aria-label="+">+</button></div></section>
 <section><h2>${t('joints')} (${js.length})</h2><div class="tw"><table><thead><tr><th>${t('jt')}</th><th>${t('ty')}</th><th class="n">in</th><th>${t('st')}</th></tr></thead><tbody>${js.map(j=>{const x=jr(j);return `<tr><td>${esc(j)}</td><td>${esc(x?x[5]:'')}</td><td class="n">${x?esc(x[4]):''}</td><td>${x?(x[1]?t('done')+(x[2]?' '+fmtD(x[2]):''):x[0]?t('fit'):t('pend')):'—'}</td></tr>`}).join('')}</tbody></table></div></section>
 <section><h2>${t('bom')}</h2><div class="tw"><table><thead><tr><th class="n">PT</th><th>${t('size')}</th><th>${t('desc')}</th><th class="n">${t('qty')}</th><th>${t('st')}</th></tr></thead><tbody>${s.items.map((it,i)=>{const q=(st[2]||[])[i]||['',0];return `<tr><td class="n">${it[0]}</td><td>${esc(it[1])}"</td><td>${esc(it[2])}</td><td class="n">${esc(it[3])} ${esc(it[4])}</td><td><span class="pl ${q[0]}">${t('st2')[q[0]]||''}</span>${q[1]>0?`<div class="note">-${esc(q[1])} ${esc(it[4])}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>${s.sp.length>1?`<p class="note">${esc(s.sp.join(', '))}</p>`:''}</section>
 ${s.cuts.length?`<section><h2>${t('cut')}</h2><div class="tw"><table><thead><tr><th>${t('piece')}</th><th class="n">${t('len')}</th><th class="n">${t('size')}</th><th>${t('rem')}</th></tr></thead><tbody>${s.cuts.map(c=>`<tr><td>&lt;${c[0]}&gt;</td><td class="n">${esc(c[1])}</td><td class="n">${esc(c[2])}"</td><td>${esc(c[3])}</td></tr>`).join('')}</tbody></table></div></section>`:''}
 ${s.loose.length?`<section><h2>${t('loose')}</h2><div class="tw"><table><thead><tr><th class="n">PT</th><th>${t('size')}</th><th>${t('desc')}</th><th class="n">${t('qty')}</th></tr></thead><tbody>${s.loose.map(l=>`<tr><td class="n">${l.pt}</td><td>${esc(l.size)}</td><td>${esc(l.desc)}</td><td class="n">${esc(l.qty)} ${esc(l.um)}</td></tr>`).join('')}</tbody></table></div></section>`:''}
 ${s.sup.length?`<section><h2>${t('sup')}</h2><div class="tw"><table><tbody>${s.sup.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td class="n">${esc(x[2])}"</td><td class="n">× ${esc(x[3])}</td></tr>`).join('')}</tbody></table></div></section>`:''}
 <section><h2>${t('title')}</h2><dl>${rows.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></section></main>`;
 $('#L').onclick=tog;let z=1;const set=n=>{z=Math.max(1,Math.min(5,n));$('#sh').style.width=z*100+'%'};if(s.full0)set(2.4);$('#zi').onclick=()=>set(z*1.5);$('#zo').onclick=()=>set(z/1.5);
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sel=+b.dataset.s;card()});
 const f=$('.mk.sp');if(f)requestAnimationFrame(()=>{const cv=$('#cv');cv.scrollTop=Math.max(0,f.offsetTop-cv.clientHeight/2);cv.scrollLeft=Math.max(0,f.offsetLeft-cv.clientWidth/2)});}
boot();
</script></body></html>

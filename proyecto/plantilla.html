<title>Tablero de avance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen control room — title strip, KPI row, 3D isometric as the plate, tabbed panel as the title block */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1b2530; --muted:#5d6b78; --line:#cfd6dc;
  --view:#1d2630; --viewgrid:#3a4756;
  --weld:#e0701f; --weld-soft:#fbe3d1; --loose:#2f78c4; --loose-soft:#dbe8f6; --bolt:#8b5cc6; --bolt-soft:#ece3f7; --ref:#8a949e;
  --accent:#1b2530; --brand:#c00000; --brand-on-dark:#c42a2a; --good:#1e7b3c;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans Condensed",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#9aa7b3; --line:#2c3640;
  --view:#0d1217; --viewgrid:#2b3642; --weld:#f08a3e; --weld-soft:#3a2617; --loose:#5d9de0; --loose-soft:#17283b; --bolt:#a985e0; --bolt-soft:#2b2140; --ref:#77818b; --accent:#e4e9ee; --brand:#e5484d; --brand-on-dark:#c42a2a; --good:#5cb85c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e4e9ee; --muted:#9aa7b3; --line:#2c3640;
  --view:#0d1217; --viewgrid:#2b3642; --weld:#f08a3e; --weld-soft:#3a2617; --loose:#5d9de0; --loose-soft:#17283b; --bolt:#a985e0; --bolt-soft:#2b2140; --ref:#77818b; --accent:#e4e9ee; --brand:#e5484d; --brand-on-dark:#c42a2a; --good:#5cb85c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
/* one-screen dashboard: header, KPI strip, then 3D (left, large) + tabbed panel (right) */
.app{height:100%;min-height:640px;max-width:1800px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;border-bottom:2px solid var(--brand);padding-bottom:8px}
.brand{background:#fff;border-radius:5px;padding:5px 9px}.brand img{display:block;height:40px;width:auto}
.ttl{min-width:0;display:grid;gap:6px}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(20px,1.9vw,28px);margin:0;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dwg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;line-height:1.4}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;align-items:baseline;gap:6px;padding:3px 9px;border:1px solid var(--line);background:var(--panel);border-radius:4px}
.stat b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat.w{border-left:4px solid var(--weld)} .stat.l{border-left:4px solid var(--loose)}
/* KPI strip */
.kpis{display:grid;grid-template-columns:1.5fr repeat(6,minmax(0,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-width:0;display:grid;gap:3px;align-content:start}
.kpi .lab{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.kpi .val{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.kpi .det{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}
.kpi .bar i{display:block;height:100%;border-radius:3px}
.kpi.main{border-color:var(--ink)}
.kpi.main .val{font-size:30px}
.kpi.main .val small{font-size:14px;color:var(--muted);margin-left:6px;font-weight:500}
.kpi .up{color:var(--good)}
.work{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,27vw,430px);gap:10px;min-height:0}
.viewer{position:relative;background:var(--view);border-radius:6px;overflow:hidden;min-height:420px;height:100%}
.viewer canvas{display:block}
#lbl{position:absolute;inset:0;pointer-events:none}
.toolbar{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.toolbar .grp{display:flex;gap:0;pointer-events:auto;border:1px solid #3d4b59;border-radius:4px;overflow:hidden;background:rgba(13,18,23,.8)}
.toolbar button{font:500 13px var(--f-body);color:#dfe6ec;background:transparent;border:0;padding:6px 10px;cursor:pointer}
.toolbar button+button{border-left:1px solid #3d4b59}
.toolbar button[aria-pressed="true"]{background:#e4e9ee;color:#12171d}
.toolbar .grp:first-child button[aria-pressed="true"]{background:var(--brand-on-dark);color:#fff}
.toolbar button:focus-visible{outline:2px solid var(--weld);outline-offset:-2px}
.legbox{position:absolute;left:10px;bottom:30px;width:250px;max-height:calc(100% - 110px);overflow:auto;background:rgba(13,18,23,.86);border:1px solid #3d4b59;border-radius:5px;color:#e6ecf1;padding:6px 10px}
.legbox summary{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:#a9b6c2;cursor:pointer;padding:2px 0}
.legbox .legend{margin-top:6px;gap:5px}
.legbox .lg{font-size:12.5px}
.legbox .lg input{width:14px;height:14px}
.legbox .lg{color:#e6ecf1}
.legbox .lg small{color:#a9b6c2}
.legbox .lg input{accent-color:#e4e9ee}
.legbox .grp{color:#a9b6c2}
.legbox .sep{border-top-color:#3d4b59}
.hint{position:absolute;left:10px;bottom:8px;font:11.5px var(--f-mono);color:#4f5b66;pointer-events:none}
:root,:root[data-theme]{--view:#ffffff!important}
:root[data-view="k"],:root[data-view="k"][data-theme]{--view:#0b0e11!important}
:root[data-view="k"] .viewer .hint{color:#aeb9c3}
.tip{position:absolute;pointer-events:none;background:rgba(13,18,23,.92);color:#eef2f5;border:1px solid #3d4b59;border-radius:4px;padding:5px 8px;font:12px var(--f-mono);white-space:nowrap;transform:translate(10px,10px)}
/* right panel with tabs */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:600 12.5px var(--f-body);letter-spacing:.3px;background:transparent;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:9px 6px 7px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--weld);outline-offset:-2px}
.tabs button span{font-family:var(--f-mono);font-weight:500;margin-left:5px;color:var(--brand)}
.pane{overflow:auto;padding:12px 14px;min-height:0}
@media (max-width:1500px){ .dwg{font-size:10.5px} }
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))} .kpi.main{grid-column:span 2}
  .top{grid-template-columns:auto minmax(0,1fr)} h1{white-space:normal;text-wrap:balance} .dwg{grid-column:1 / -1;text-align:left}
}
@media (max-width:900px){
  html,body{height:auto} .app{height:auto;min-height:0}
  .work{grid-template-columns:minmax(0,1fr)} .viewer{height:62vh;min-height:360px} .side{max-height:none} .pane{overflow-x:auto;overflow-y:visible}
  .legbox{width:210px} .legbox:not([open]){width:auto}
}
@media (max-width:560px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .hint,.cutlabel{display:none!important} .brand img{height:32px} .legbox{bottom:8px} }
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.pane h2,.card h2{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px}
.legend{display:grid;gap:8px}
.lg{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.lg input{accent-color:var(--ink);width:16px;height:16px}
.sw{width:28px;height:10px;border-radius:2px;flex:none}
.lg small{color:var(--muted);margin-left:auto;font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12.5px var(--f-body);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:focus-visible,.mk:focus-visible{outline:2px solid var(--weld);outline-offset:1px}
#insp .empty{color:var(--muted);font-size:13.5px}
.ihead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ihead b{font:600 22px var(--f-mono)}
.pill{font:600 11px var(--f-body);letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:3px}
.pill.w{background:var(--weld);color:#fff} .pill.l{background:var(--loose);color:#fff}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 0;font-size:13.5px}
dt{color:var(--muted)} dd{margin:0;min-width:0}
ul.parts{margin:6px 0 0;padding-left:18px;font-size:13px;font-family:var(--f-mono)}
.list{display:grid;gap:10px}
.list h3{font:600 12.5px var(--f-body);margin:0 0 5px;display:flex;align-items:center;gap:6px}
.mks{display:flex;flex-wrap:wrap;gap:4px}
.mk{font:500 12px var(--f-mono);border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:3px;padding:2px 6px;cursor:pointer}
.mk.w{background:var(--weld-soft)} .mk.l{background:var(--loose-soft)}
.mk.sel{outline:2px solid var(--ink)}
.note{font-size:12.5px;color:var(--muted)}

.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;font:500 13px var(--f-body);background:transparent;color:var(--ink);border:0;padding:7px 8px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--weld);outline-offset:-2px}
.lg{font-size:13.5px}
.lg .sw.line{height:3px}
.lg .grp{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:4px}
.legend .sep{border-top:1px dashed var(--line);margin:2px 0}
table.pt{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
table.pt th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:3px 4px}
table.pt td{border-bottom:1px solid var(--line);padding:4px;vertical-align:top}
table.pt td.mk2{font-family:var(--f-mono);white-space:nowrap}
table.pt tr{cursor:pointer}
table.pt tr:hover td{background:var(--loose-soft)}
table.pt .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.focuspart{margin-top:8px;padding:8px 10px;border-radius:4px;background:var(--weld-soft);font-size:13px}
.focuspart b{font-family:var(--f-mono)}
.kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--ink);font-family:var(--f-mono);font-size:14px}

.prog .src{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.prog .src.demo{color:#fff;background:#b45309;border-radius:3px;padding:4px 8px;font-weight:600}
.prog .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--weld);outline-offset:1px}
.cut{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 10px}
.cut select{flex:1;min-width:0;font:500 13px var(--f-mono);padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.st{display:grid;grid-template-columns:14px 1fr auto auto;gap:4px 8px;align-items:center;font-size:13px}
.st .sw{width:14px;height:14px;border-radius:3px}
.st b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.st small{color:var(--muted);font-family:var(--f-mono);text-align:right;min-width:44px}
.big{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
.big b{font:600 26px var(--f-mono)}
.big span{color:var(--muted);font-size:12.5px}
svg.sc{width:100%;height:auto;display:block}
.msg{font-size:12.5px;margin-top:6px}
.msg.err{color:#c0392b}
.banner{position:absolute;right:10px;top:96px;max-width:calc(100% - 20px);background:#b45309;color:#fff;font:600 12px var(--f-body);padding:4px 10px;border-radius:3px;pointer-events:none}
.cutlabel{position:absolute;right:10px;top:48px;background:rgba(13,18,23,.82);color:#eef2f5;border:1px solid #3d4b59;border-radius:4px;padding:6px 10px;font:600 13px var(--f-mono);pointer-events:none}
.cutlabel small{display:block;font:500 11px var(--f-body);color:#93a1ae;text-transform:uppercase;letter-spacing:.6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.hdr-r{display:grid;gap:6px;justify-items:end;max-width:430px}
.top h1{white-space:normal;text-wrap:balance}
.top .dwg{font-size:10.5px}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{font:600 12px var(--f-mono);background:var(--panel);color:var(--muted);border:0;padding:4px 10px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
.lang button:focus-visible{outline:2px solid var(--weld);outline-offset:-2px}
.stat.b{border-left:4px solid var(--bolt)} .pill.b{background:var(--bolt);color:#fff} .mk.s{background:var(--bolt-soft)}
.srch{width:100%;font:500 13px var(--f-body);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);margin-bottom:10px}
details.joints{border:1px solid var(--line);border-radius:5px;padding:6px 10px;background:color-mix(in srgb,var(--bolt-soft) 55%,transparent)}
details.joints summary{font:600 12.5px var(--f-body);cursor:pointer;color:var(--ink)}
.jgrp{margin-top:8px} .jgrp .jl{cursor:pointer;font-size:12.5px} .jt{margin-top:3px} .jt td{font-size:12px}
.boltbox{margin-top:10px;padding:8px 10px;border:1px solid var(--bolt);border-radius:5px;background:color-mix(in srgb,var(--bolt-soft) 60%,transparent)}
.boltbox h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.6px;margin:0;color:var(--ink)}
.boltbox table.pt{margin-top:6px}
.grp2{margin-top:10px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
button.lnk{font:500 13px var(--f-mono);background:none;border:0;padding:0;color:var(--loose);text-decoration:underline;cursor:pointer}
select.sel{flex:1;min-width:0;font:500 13px var(--f-body);padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.toolbar button[aria-pressed="true"]#t-bolt{background:#8b5cc6;color:#fff}
@media (max-width:1100px){ .hdr-r{grid-column:1 / -1;justify-items:start} }
/* Navisworks-style docked panel: rail on the right, panel slides out to the left over the 3D */
.work{position:relative;display:block;min-height:0}
.viewer{position:absolute;inset:0 46px 0 0;min-height:420px;height:auto}
.rail{position:absolute;top:0;right:0;bottom:0;width:40px;display:flex;flex-direction:column;gap:6px;z-index:6}
.rail button{writing-mode:vertical-rl;transform:rotate(180deg);font:600 12px var(--f-body);letter-spacing:.4px;padding:12px 0;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.rail button .ri{transform:rotate(90deg);font-size:13px}
.rail button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.rail button:focus-visible{outline:2px solid var(--weld);outline-offset:1px}
.side{position:absolute;top:0;bottom:0;right:46px;width:clamp(340px,30vw,460px);z-index:5;box-shadow:-8px 0 24px rgba(0,0,0,.28);transition:transform .22s ease,opacity .22s ease}
.side.closed{transform:translateX(24px);opacity:0;pointer-events:none}
.sclose{flex:0 0 auto!important;font:600 12px var(--f-mono)!important;color:var(--muted)!important;padding:9px 10px 7px!important}
.mk .mpar{color:var(--muted);font-size:11px}
@media (max-width:900px){ .work{height:70vh} .side{width:calc(100% - 52px)} }
.attn{width:430px;max-width:100%;position:relative}
.attn .card{border:1px solid var(--line);border-left:4px solid #c0392b;border-radius:5px;background:var(--panel);padding:6px 10px;text-align:left}
.attn.open .card{position:absolute;top:0;right:0;left:0;z-index:40;max-height:70vh;overflow:auto!important;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.attn .ah{display:flex;justify-content:space-between;gap:8px;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--ink)}
.attn .ah span{font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;white-space:nowrap}
.attn em{font-style:normal;color:#c0392b;font-weight:700}
.attn ul{list-style:none;margin:5px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.attn li,.attn .card{min-width:0}
.attn .card{overflow:hidden}
.attn:not(.open) li:nth-child(n+3){display:none}
.attn li{display:flex;gap:7px;align-items:flex-start;font-size:12px;line-height:1.3}
.attn li i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:4px;background:#9aa5b1}
.attn li.pH i{background:#d93025} .attn li.pM i{background:#f2a516}
.attn li div{min-width:0;flex:1}
.attn .at{font:500 10.5px var(--f-mono);color:var(--muted)}
.attn .at .lnk{font-size:10.5px}
.attn p{margin:1px 0 0;color:var(--ink)}
.attn:not(.open) p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn .amore{margin-top:4px;font:600 11px var(--f-body);background:none;border:0;padding:0;color:var(--loose);cursor:pointer}
.attn .anone{margin:4px 0 0;font-size:12px;color:var(--muted)}
.bt tr.gh td{background:color-mix(in srgb,var(--line) 45%,transparent);cursor:default;font-weight:600}
.bt tr[data-j]{cursor:pointer} .bt tr.on td{background:color-mix(in srgb,#b98cff 30%,transparent)}
.okb{color:#1e7b3c;font-weight:700}
details.bsum{margin-top:8px;border:1px solid var(--line);border-radius:5px;padding:5px 8px} details.bsum summary{cursor:pointer;font:600 12px var(--f-body)}
.bfil{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px} .bfil .srch{flex:1;min-width:160px;margin:0}
.side .tabs button{font-size:12.5px}
@media (max-width:1100px){ .attn{width:100%} }
/* rail drives navigation: panel shows a title instead of tabs */
.side .tabs [role=tab]{display:none}
.side .tabs{align-items:center}
.ptitle{flex:1;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.7px;color:var(--ink);padding:10px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:-1}
.rail button{position:relative}
.rb{position:absolute;bottom:-6px;right:-6px;transform:rotate(180deg);writing-mode:horizontal-tb;min-width:18px;height:18px;border-radius:9px;background:#5f6b76;color:#fff;font:700 10.5px var(--f-mono);display:grid;place-items:center;padding:0 4px}
.rb.hi{background:#d93025}

  el.querySelectorAll('tr[data-v]').forEach(tr=>tr.onclick=()=>{ M.vf = M.vf===tr.dataset.v ? '' : tr.dataset.v; renderMat(); }); }

// =====================================================================  quick search (header): assembly / frame, mark, element type or 3D ID
const gs = document.getElementById('gs'), gres = document.getElementById('gres');
const BLOCKS = {}; marks.forEach(k=>{ const b = parOf(k)[0]; (BLOCKS[b] ||= []).push(k); });
const aisWhere = fn => A.map((k,i)=>info[k] && fn(k) ? i+1 : null).filter(Boolean);
let GSI = 0, GSH = [];
const NORM = x => String(x==null?'':x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[\s\-_.·"']/g,'');
// every part of the 3D (welded plates, angles, stiffeners…) → the pieces that contain it
const PARTIX = {}; parts.forEach((p,i)=>{ if(!info[A[p[0]-1]]) return; const o = PARTIX[p[1]] ||= {ais:new Set(), n:0, w:p[3]!=='M'}; o.ais.add(p[0]); o.n++; });
const PROFS = {}; marks.forEach(k=>{ const pr = info[k].pr; if(pr) (PROFS[pr] ||= new Set()).add(k); });
Object.entries(pdesc).forEach(([pm,d])=>{ if(d && PARTIX[pm]) (PROFS[d] ||= new Set()).add('#'+pm); });
function searchHits(q0){ const q = NORM(q0); if(!q) return []; const out = [], seen = new Set();
  const add = h => { const k = h.kind+'|'+h.lab+'|'+(h.b||h.k||h.pm||h.pr||h.ty||h.ai); if(seen.has(k)) return; seen.add(k); out.push(h); };
  const sc = (txt, base) => NORM(txt)===q ? base : NORM(txt).startsWith(q) ? base+0.3 : base+0.6;
  if(/^#?\d+$/.test(q0.trim())){ const id = +q0.trim().replace('#',''); if(id>=1 && id<=A.length) add({kind:'id', ai:id, lab:`ID ${id}`, sub:NM(A[id-1]), sc:0}); }
  Object.keys(BLOCKS).forEach(b=>{ if(NORM(b).includes(q)){ const n = BLOCKS[b].reduce((s,k)=>s+info[k].q,0);
    add({kind:'blk', b, lab:b, sub:`${tt(info[b] ? info[b].t : '')} · ${t('gsPieces', n)}${BLOCKS[b].length>1 ? ' · '+t('gsMarks', BLOCKS[b].length) : ''}`, sc:sc(b,0)}); } });
  marks.forEach(k=>{ const i = info[k]; if(!i.m && NORM(NM(k)).includes(q)) add({kind:'mk', k, lab:NM(k), sub:`${tt(i.t)} · ${i.pr} ×${i.q} · ${i.par}`, sc:sc(NM(k),1)}); });
  Object.entries(PARTIX).forEach(([pm,o])=>{ if(o.w && NORM(pm).includes(q)){ const hs = [...new Set([...o.ais].map(ai=>NM(A[ai-1])))];
    add({kind:'part', pm, lab:pm, sub:`${pdesc[pm]||''} · ×${o.n} · ${t('gsWeldedTo')} ${hs.slice(0,4).join(', ')}${hs.length>4?' …':''}`, sc:sc(pm,1.1)}); } });
  Object.entries(PROFS).forEach(([pr,set])=>{ if(NORM(pr).includes(q)) add({kind:'prof', pr, lab:pr, sub:t('gsProf', set.size), sc:sc(pr,2)}); });
  [...new Set(marks.map(k=>info[k].t))].forEach(ty=>{ if(NORM(ty).includes(q) || NORM(tt(ty)).includes(q)){
    const n = marks.filter(k=>info[k].t===ty).reduce((s,k)=>s+info[k].q,0); add({kind:'type', ty, lab:tt(ty), sub:t('gsType', n), sc:3}); } });
  Object.keys(CATC).forEach(c=>{ if(c==='REF') return; const nm = t(c); const en = I18N.en[c]||'', es = I18N.es[c]||'';
    if([nm,en,es].some(x=>NORM(x).includes(q))){ const n = meshes.filter(m=>m.userData.cat===c).length; if(n) add({kind:'cat', c, lab:nm, sub:t('gsCat', n), sc:3.5}); } });
  return out.sort((a,b)=>a.sc-b.sc || a.lab.localeCompare(b.lab, undefined, {numeric:true})).slice(0, 25); }
function selectSet(ais, mark, hl){ if(!ais.length) return; state.boltRow = null; state.sel = new Set(ais); state.mates = matesOf(state.sel); state.selPart = null; state.selMark = mark || null; state.hlPm = hl || null;
  document.querySelectorAll('.mk').forEach(b=>b.classList.toggle('sel', b.dataset.m===mark)); apply(); renderInsp(); renderBolts(); frame(ais); showTab('insp'); }
function goHit(h){ if(!h) return; gres.hidden = true;
  if(h.kind==='id'){ select(h.ai); frame([h.ai]); }
  else if(h.kind==='blk') selectSet(aisWhere(k=>parOf(k).includes(h.b)), h.b);
  else if(h.kind==='mk') selectMark(h.k);
  else if(h.kind==='type') selectSet(aisWhere(k=>info[k].t===h.ty), null);
  else if(h.kind==='cat') selectSet([...new Set(meshes.filter(m=>m.userData.cat===h.c).map(m=>m.userData.ai))], null, u=>u.cat===h.c);
  else if(h.kind==='part') selectSet([...PARTIX[h.pm].ais], null, u=>u.pm===h.pm);
  else if(h.kind==='prof'){ const ks = PROFS[h.pr]; const ais = new Set(aisWhere(k=>ks.has(k)));
    parts.forEach(p=>{ if(ks.has('#'+p[1]) && info[A[p[0]-1]]) ais.add(p[0]); });
    selectSet([...ais], null, u=>(u.rl==='M' && info[u.am] && info[u.am].pr===h.pr) || (u.rl!=='M' && pdesc[u.pm]===h.pr)); } }
function renderHits(){ GSH = searchHits(gs.value); GSI = Math.min(GSI, Math.max(GSH.length-1, 0));
  if(!gs.value.trim()){ gres.hidden = true; return; }
  gres.innerHTML = GSH.length ? GSH.map((h,j)=>`<button type="button" class="gh${j===GSI?' on':''}" data-j="${j}"><b>${esc(h.lab)}</b><small>${esc(h.sub)}</small><i>${t('gs_'+h.kind)}</i></button>`).join('') : `<div class="gnone">${t('gsNone')}</div>`;
  gres.hidden = false; gres.querySelectorAll('button[data-j]').forEach(b=>b.onmousedown=e=>{ e.preventDefault(); goHit(GSH[+b.dataset.j]); }); }
gs.addEventListener('input', ()=>{ GSI = 0; renderHits(); });
gs.addEventListener('focus', ()=>{ if(gs.value.trim()) renderHits(); });
gs.addEventListener('blur', ()=>setTimeout(()=>{ gres.hidden = true; }, 150));
gs.addEventListener('keydown', e=>{ if(e.key==='ArrowDown'){ GSI = Math.min(GSI+1, GSH.length-1); renderHits(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ GSI = Math.max(GSI-1, 0); renderHits(); e.preventDefault(); }
  else if(e.key==='Enter'){ goHit(GSH[GSI]); } else if(e.key==='Escape'){ gs.value = ''; gres.hidden = true; } });

// =====================================================================  language
function renderStatic(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el=>el.innerHTML = t(el.dataset.i));
  document.title = ALLV ? t('pAll') : PM[LANG].short + ' · ' + (LANG==='es' ? 'Mapa de soldadura' : 'Weld Map');
  const ps = document.getElementById('projsel'); if(ps){ ps.innerHTML = PKEYS.map(k=>`<option value="${k}">${PROJS[k][LANG].short}</option>`).join('') + `<option value="all">${t('pAll')}</option>`; ps.value = PROJ; }
  if(ALLV) renderSummary();
  qbox.placeholder = t('search'); gs.placeholder = t('gsPh');
  const pcs = f => marks.filter(f).reduce((s,k)=>s+info[k].q,0);
  const weldIn = marks.reduce((s,k)=>s+(info[k].w ? (info[k].lw||0)*info[k].q : 0),0);
  document.getElementById('stats').innerHTML =
    `<div class="stat w"><b>${nf(pcs(k=>kindOf(k)==='w'))}</b><span>${t('stW')}</span></div>
     <div class="stat l"><b>${nf(pcs(k=>!info[k].w))}</b><span>${t('stL')}</span></div>
     <div class="stat"><b>${nf(welds.length)}</b><span>${t('stWelds')} · ${nf(Math.round(weldIn))} in</span></div>
     <div class="stat"><b>${nf(nb)}</b><span>${t('stBolts')}</span></div>`;
  ['en','es'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed', l===LANG));
}
function setLang(l){ LANG = l; try{ localStorage.setItem('dt2-lang', l); }catch(e){} renderStatic(); renderList(); renderLegend(); renderInsp(); renderProg(); renderBolts(); setTitle(); }
document.getElementById('lang-en').onclick = ()=>setLang('en'); document.getElementById('lang-es').onclick = ()=>setLang('es');

// =====================================================================  loop
function resize(){ const w=host.clientWidth, h=host.clientHeight, dpr=Math.min(devicePixelRatio,2);
  renderer.setSize(w,h,false); cv.style.width=w+'px'; cv.style.height=h+'px'; lc.width=w*dpr; lc.height=h*dpr; lc.style.width=w+'px'; lc.style.height=h+'px'; lx.setTransform(dpr,0,0,dpr,0,0);
  cam.aspect=w/h; cam.updateProjectionMatrix(); }
function bg(){ renderer.setClearColor(css('--view')); }
new ResizeObserver(resize).observe(host);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bg);
new MutationObserver(bg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-view']});
renderStatic(); renderList(); resize(); bg(); setView('iso'); apply(); renderInsp(); renderBolts(); renderNotes(); renderMat(); setTitle();
try{ const saved = JSON.parse(lsGet('wtp-prog-'+PSC)||'null') || (window.EMBED_PROG ? JSON.parse(JSON.stringify(window.EMBED_PROG)) : null);
  if(saved && saved.f){ const f={}; Object.entries(saved.f).forEach(([k,v])=>f[+k]=v); Object.keys(f).forEach(k=>f[k]=normF(f[k])); saved.f=f; if(saved.p){ const p={}; Object.entries(saved.p).forEach(([k,v])=>p[+k]=v); saved.p=p; } if(saved.x){ const x={}; Object.entries(saved.x).forEach(([k,v])=>x[+k]=v); saved.x=x; } if(saved.wi){ const w={}; Object.entries(saved.wi).forEach(([k,v])=>w[+k]=v); saved.wi=w; } if(saved.ar){ const w={}; Object.entries(saved.ar).forEach(([k,v])=>w[+k]=v); saved.ar=w; } setProg(saved); } else renderProg(); }catch(e){ renderProg(); }
initShared();
{ const m0 = lsGet('wtp-msg'); if(m0 && !ALLV){ progMsg = m0; lsSet('wtp-msg', ''); renderProg(); } }
(function loop(){ ctl.update(); renderer.render(scene,cam); drawLabels(host.clientWidth, host.clientHeight); requestAnimationFrame(loop); })();
</script>

<script id="pr-sap">
/* ===== Agregado: PR para SAP (pestaña Material → PURCHASING) =====
   No cambia nada de lo que ya hace el tablero: se dibuja debajo del resumen de compras.
   · «Cargar códigos SAP»: cada quien carga su Excel de códigos SAP; queda guardado solo en esta computadora.
   · «Armar PR para ME51N»: header note, valores por defecto (ligados a todas las líneas; cada línea se puede cambiar a mano)
     y la tabla con las columnas en el orden de la ME51N desde «A» hasta «TrackingNo». Se copia con el cursor o con el botón. */
(function(){
  const L=(es,en)=>LANG==='es'?es:en, E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const G=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, S=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
  let CAT=G('prsap-cat',null), DEF=Object.assign({hdr:'',acct:'Q (Proj. make-to-order)',wbs:'',gl:'1310000110',plant:'1000',pgr:'BY3',req:'',trk:'MFG-GTE',date:''},G('prsap-def',{})), OPEN=false;
  const OV=()=>G('prsap-ov-'+(typeof PSC!=='undefined'?PSC:'x'),{}), setOV=o=>S('prsap-ov-'+(typeof PSC!=='undefined'?PSC:'x'),o);
  const COLS=['A','I','Material','Short Text','Quantity','Unit','PO','Crcy','Valn Price','Price Unit','Delivery Date','Material Group','Plant','Stor. Loc.','PGr','Requisitioner','TrackingNo'];
  const UNIT=u=>{ const s=String(u||'').toLowerCase().replace(/\s+/g,''); return /ft²|ft2|sqft|ft\^2/.test(s)?'FT2':/^ft$|feet|lf/.test(s)?'FT':/ea|pc|pza|each/.test(s)?'EA':String(u||'').toUpperCase(); };
  // clave de material: perfil/medida + grado (W8X13|A992, L4X4X3/8|A36, PL3/8|A36…)
  const tok=d=>{ const s=String(d||'').toUpperCase().replace(/\s+/g,' '); const m=s.match(/\b(W\d+X[\d.]+|HSS[\d.\/X-]+|PIPE[\d\/.\- ]+SCH ?\d+|C\d+X[\d.]+|MC\d+X[\d.]+|L[\d.\/-]+X[\d.\/-]+X[\d.\/-]+|WT\d+X[\d.]+|ROD ?[\d\/.]+"?)/); if(m) return m[1].replace(/\s+/g,'');
    const p=s.match(/\bPL(?:ATE)?\s*(?:T\s*=\s*)?([\d\/.\- ]+)"?/); return p?'PL'+p[1].replace(/\s+/g,''):''; };
  const grd=g=>String(g||'').toUpperCase().replace(/\s+/g,'').replace(/^ASTM/,'');
  function catFind(r){ if(!CAT||!CAT.rows) return null; const k=tok(r.d), g=grd(r.g); if(!k) return null;
    const hits=CAT.rows.filter(x=>x.k===k&&(!g||!x.g||x.g.indexOf(g)>=0||g.indexOf(x.g)>=0)); return hits.length?hits.sort((a,b)=>(+b.code)-(+a.code))[0].code:null; }
  async function loadCat(file){ const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'}); const rows=[];
    wb.SheetNames.forEach(n=>{ const A=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}); if(!A.length) return; const w=Math.max(...A.slice(0,200).map(r=>r?r.length:0));
      let cc=-1,best=0; for(let c=0;c<w;c++){ const k=A.filter(r=>r&&/^\s*\d{5,8}\s*$/.test(String(r[c]??''))).length; if(k>best){ best=k; cc=c; } } if(cc<0||best<3) return;
      let dc=-1,dl=0; for(let c=0;c<w;c++){ if(c===cc) continue; const l=A.reduce((s,r)=>s+(r&&typeof r[c]==='string'?r[c].length:0),0); if(l>dl){ dl=l; dc=c; } }
      A.forEach(r=>{ if(!r||!/^\s*\d{5,8}\s*$/.test(String(r[cc]??''))) return; const d=String(r[dc]??''); if(/^\*|TBD/i.test(d)) return; const k=tok(d); if(!k) return;
        const gm=d.toUpperCase().match(/\b(A\d{2,4}(?:[-\s]?GR\.?\s?\d+)?|A992|A36|A500[^\s,]*|A572[^\s,]*|A53[^\s,]*|A325N?|F1554[^\s,]*)\b/); rows.push({code:String(r[cc]).trim(),desc:d.trim(),k,g:gm?grd(gm[1]):''}); }); });
    if(!rows.length) throw new Error(L('No encontré códigos SAP (columna con números de 5 a 8 dígitos) en ese Excel.','No SAP codes found (a column of 5–8 digit numbers) in that Excel.'));
    CAT={rows,file:file.name,at:new Date().toISOString().slice(0,10)}; S('prsap-cat',CAT); return rows.length; }
  function items(){ const M=typeof matSrc==='function'?matSrc():null; if(!M) return []; const ov=OV();
    return M.rows.filter(r=>r.q>0).map((r,i)=>{ const code=r.sap||catFind(r)||''; const o=ov[r.it]||{};
      return {it:r.it, ref:`${r.d||''}${r.g?' '+r.g:''}`.trim(), item:(i+1)*10, code, short:code?'':`${String(r.d||'').toUpperCase()}${r.g?' '+r.g:''}`, qty:r.q, unit:UNIT(r.u), o}; }); }
  function val(x,col){ if(x.o[col]!=null&&x.o[col]!=='') return x.o[col]; const d=DEF; switch(col){
    case 'A': return String(d.acct||'').trim().charAt(0); case 'Material': return x.code; case 'Short Text': return x.short; case 'Quantity': return x.qty; case 'Unit': return x.unit;
    case 'Crcy': return 'USD'; case 'Valn Price': return '0.01'; case 'Price Unit': return '1'; case 'Delivery Date': return d.date; case 'Plant': return d.plant; case 'PGr': return d.pgr;
    case 'Requisitioner': return d.req; case 'TrackingNo': return d.trk; default: return ''; } }
  function tsv(){ return items().map(x=>COLS.map(c=>String(val(x,c)??'').replace(/[\t\n]/g,' ')).join('\t')).join('\n'); }
  function html(){ const IT=items(), nS=IT.filter(x=>val(x,'Material')).length;
    const f=(k,lbl,w)=>`<label style="display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)">${lbl}<input data-pd="${k}" value="${E(DEF[k])}" style="font:500 12.5px var(--f-mono);padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:${DEF[k]?'var(--panel)':'#fff3c4'};color:var(--ink);width:${w||110}px"></label>`;
    return `<div class="grp2" style="margin-top:14px">${L('PR PARA SAP (ME51N)','PR FOR SAP (ME51N)')}</div>
      <div class="hrow" style="justify-content:flex-start;margin:6px 0">
        <label class="hload" style="background:var(--panel);color:var(--ink);border-color:var(--line)">${L('Cargar códigos SAP','Load SAP codes')}<input type="file" id="prs-cat" accept=".xlsx,.xls" hidden></label>
        <button class="hload" type="button" id="prs-open">${OPEN?L('Ocultar PR','Hide PR'):L('Armar PR para ME51N','Build PR for ME51N')}</button></div>
      <div class="note" id="prs-msg">${CAT?L(`Catálogo SAP: ${CAT.rows.length} códigos · ${E(CAT.file)} · ${CAT.at} (solo en esta computadora)`,`SAP catalog: ${CAT.rows.length} codes · ${E(CAT.file)} · ${CAT.at} (this computer only)`):L('Sin catálogo SAP cargado: se usan los códigos de la hoja VENDOR REQUISITION.','No SAP catalog loaded: codes come from the VENDOR REQUISITION sheet.')} · ${nS}/${IT.length} ${L('con código SAP','with SAP code')}</div>
      ${!OPEN?'':`<div style="margin-top:8px">
        <label style="display:block;font-size:11px;color:var(--muted)">${L('Header note (pestaña Texts → Header note)','Header note (Texts tab → Header note)')}
          <textarea data-pd="hdr" rows="3" style="width:100%;font:500 12.5px var(--f-body);padding:5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)">${E(DEF.hdr||((typeof PROJS!=='undefined'&&PROJS[PSC])?PROJS[PSC][LANG].title:''))}</textarea></label>
        <div style="font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px">${L('Default values (botón Default Values en la ME51N)','Default values (Default Values button in ME51N)')}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${f('acct','Acct. assignment cat.',150)}${f('wbs','WBS element',130)}${f('gl','G/L account')}${f('plant','Plant',70)}${f('pgr','Purchasing group',90)}${f('req','Requisitioner',120)}${f('trk','Tracking No.',90)}${f('date','Delivery date',100)}</div>
        <p class="note" style="margin:6px 0">${L('Selecciona con el cursor desde la columna A hasta TrackingNo (sin Referencia ni Item) y pega en la columna A del primer renglón vacío de la ME51N, o usa «Copiar para ME51N». Las casillas se pueden escribir; las de los default cambian en todas las líneas.','Select with the cursor from column A to TrackingNo (without Reference or Item) and paste into column A of the first empty ME51N row, or use “Copy for ME51N”. Cells are editable; default cells change in every line.')}</p>
        <div class="wkwrap"><table class="pt wkt" id="prs-t"><thead><tr><th style="user-select:none">${L('Referencia','Reference')}</th><th style="user-select:none">Item</th>${COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
        ${IT.map(x=>`<tr data-it="${E(x.it)}"><td style="user-select:none;white-space:nowrap">${E(x.ref)}</td><td style="user-select:none">${x.item}</td>${COLS.map(c=>{ const v=val(x,c), miss=c==='Material'&&!v; return `<td contenteditable="true" data-c="${E(c)}" style="${miss?'background:#fff3c4;':''}${x.o[c]!=null&&x.o[c]!==''?'font-weight:700;':''}">${E(v)}</td>`; }).join('')}</tr>`).join('')}
        </tbody></table></div>
        <div class="hrow" style="justify-content:flex-start;margin-top:8px"><button class="hload" type="button" id="prs-copy">${L('Copiar para ME51N','Copy for ME51N')}</button><button class="hload" type="button" id="prs-xl" style="background:var(--panel);color:var(--ink);border-color:var(--line)">${L('Descargar Excel PR','Download PR Excel')}</button><span class="note" id="prs-ok"></span></div>
      </div>`}`; }
  function mount(){ const el=document.getElementById('mpane'); if(!el||!(typeof matSrc==='function'&&matSrc())) return; let box=document.getElementById('prs-box'); if(!box){ box=document.createElement('div'); box.id='prs-box'; el.appendChild(box); }
    box.innerHTML=html();
    const cat=document.getElementById('prs-cat'); if(cat) cat.onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; const m=document.getElementById('prs-msg'); m.textContent=L('Leyendo…','Reading…');
      try{ const n=await loadCat(f); mount(); document.getElementById('prs-msg').textContent+=` · ${L('cargados','loaded')} ${n}`; }catch(err){ m.textContent=err.message||String(err); } };
    document.getElementById('prs-open').onclick=()=>{ OPEN=!OPEN; mount(); };
    box.querySelectorAll('[data-pd]').forEach(i=>i.onchange=()=>{ DEF[i.dataset.pd]=i.value.trim(); S('prsap-def',DEF); mount(); });
    box.querySelectorAll('#prs-t td[data-c]').forEach(td=>td.onblur=()=>{ const tr=td.closest('tr'), it=tr.dataset.it, c=td.dataset.c, ov=OV(); const x=items().find(y=>String(y.it)===it); const base=x?val(Object.assign({},x,{o:{}}),c):'';
      const v=td.textContent.trim(); ov[it]=ov[it]||{}; if(v===String(base??'')) delete ov[it][c]; else ov[it][c]=v; setOV(ov); });
    const cp=document.getElementById('prs-copy'); if(cp) cp.onclick=async()=>{ const ok=document.getElementById('prs-ok'); try{ await navigator.clipboard.writeText(tsv()); ok.textContent=L('Copiado. Pega en la columna A de la ME51N.','Copied. Paste into column A of ME51N.'); }catch(e){ ok.textContent=L('No se pudo copiar; selecciona la tabla con el cursor.','Could not copy; select the table with the cursor.'); } };
    const xl=document.getElementById('prs-xl'); if(xl) xl.onclick=async()=>{ const X=await loadXLSX(), IT=items(), A=[[`PR para SAP · ${(typeof PROJS!=='undefined'&&PROJS[PSC])?PROJS[PSC][LANG].title:''}`],['HEADER NOTE (Texts → Header note)'],...String(DEF.hdr||'').split(/\n/).filter(Boolean).map(t=>[t]),[],['DEFAULT VALUES'],
        ['Acct. assignment cat.',DEF.acct],['WBS element',DEF.wbs],['G/L account',DEF.gl],['Plant',DEF.plant],['Purchasing group',DEF.pgr],['Requisitioner',DEF.req],['Tracking No.',DEF.trk],['Delivery date',DEF.date],[],
        ['ITEMS — A … TrackingNo → Ctrl+C → ME51N col. A'],['Referencia (no se copia)','Item',...COLS],...IT.map(x=>[x.ref,x.item,...COLS.map(c=>val(x,c))])];
      const ws=X.utils.aoa_to_sheet(A); ws['!cols']=[{wch:28},{wch:7},...COLS.map(()=>({wch:13}))]; const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,'PR SAP');
      const buf=X.write(wb,{bookType:'xlsx',type:'array'}); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})); a.download=`PR_SAP_${(typeof PSC!=='undefined'?PSC:'')}.xlsx`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); }; }
  const _rm=renderMat; renderMat=function(){ const r=_rm.apply(this,arguments); try{ mount(); }catch(e){ console.warn('PR SAP',e); } return r; };
  try{ mount(); }catch(e){}
})();
</script>
<div id="np-box" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg,#fff);grid-template-rows:auto minmax(0,1fr)"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;border-bottom:2px solid var(--brand,#1f5fa8)"><b id="np-title" style="font-size:15px"></b><button id="np-close" type="button" class="hload">✕</button></div><iframe id="np-frame" title="Nuevo proyecto" style="width:100%;height:100%;border:0"></iframe></div>
<script id="nuevo-proyecto">
/* ===== Agregado: «Nuevo proyecto» dentro del tablero. No cambia las pestañas: abre la carga de BOM, IFC y pernos en un panel y agrega los proyectos publicados al selector. ===== */
(function(){ const L=(es,en)=>LANG==='es'?es:en, $=id=>document.getElementById(id), fill=()=>{ const gp=$('grpsel'), gb=$('grpbox'), nw=$('h-newt'), gl=$('grplb'); if(nw) nw.textContent=L('Nuevo proyecto','New project'); if(gl) gl.textContent=L('Contrato','Contract'); if(!gp) return; gp.innerHTML=TB.list.map(p=>`<option value="${String(p.code).replace(/"/g,'&quot;')}">${p.code}</option>`).join(''); gp.value=TB.cur.code; gb.hidden=TB.list.length<2; };
  const lists=()=>TB.solo?Promise.resolve():fetch(TB.base+'index.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ if(!j) return; const seen=new Set(TB.list.map(p=>p.code)); (j.proyectos||[]).forEach(p=>{ if(!seen.has(p.code)){ TB.list.push({code:p.code}); seen.add(p.code); } }); fill(); }).catch(()=>{});
  $('grpsel').onchange=e=>{ location.href=location.pathname+'?g='+encodeURIComponent(e.target.value); };
  const box=$('np-box'); $('h-new').style.display='none'; /* el HTML de un proyecto no crea proyectos: eso lo hace la plantilla */ $('np-close').onclick=()=>{ box.style.display='none'; lists(); };
  $('np-title').textContent='Nuevo proyecto'; fill(); ['lang-en','lang-es'].forEach(i=>{ const b=$(i); if(b) b.addEventListener('click',()=>setTimeout(fill,0)); }); lists(); })();
</script>

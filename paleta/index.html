<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paleta</title>
<meta name="theme-color" content="#1d2326">
<link rel="icon" href="../despacho/icon-192.png">
<style>
:root{--bg:#eef1f3;--ink:#1d2326;--mut:#5d6a71;--card:#fff;--line:#d5dbdf;--acc:#b5532a;--top:#1d2326;--bad:#b3261e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--ink:#e8ecee;--mut:#9aa6ad;--card:#1f2528;--line:#33393d;--acc:#e07a4a;--bad:#f08078}}
:root[data-theme="dark"]{--bg:#15191b;--ink:#e8ecee;--mut:#9aa6ad;--card:#1f2528;--line:#33393d;--acc:#e07a4a;--bad:#f08078}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
#lang{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:var(--top)}
#lang span{font:500 12px/1 var(--body);color:#c9d1d4;margin-right:auto}
#lang button{all:unset;cursor:pointer;font:600 14px/1 var(--body);padding:8px 14px;border-radius:999px;color:#fff;border:1px solid #6f7f88}
#lang button[aria-pressed="true"]{background:#fff;color:#1d2326;border-color:#fff}
main{max-width:920px;margin:0 auto;padding:16px}
.eyebrow{font:600 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:4px 0}
h1{font-size:26px;margin:0 0 2px}
.mut{color:var(--mut);font-size:14px;margin:0}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tot div{background:var(--card);border:1px solid var(--line);padding:10px}
.tot b{display:block;font:700 22px var(--mono)}
.tot span{font-size:12px;color:var(--mut)}
@media (max-width:560px){.tot{grid-template-columns:repeat(2,1fr)}}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}
th{font:600 11px var(--mono);text-transform:uppercase;color:var(--mut);background:var(--bg)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tfoot td{font-weight:700;border-top:2px solid var(--ink)}
td a{color:var(--acc);font-weight:700;text-decoration:none}
.err{color:var(--bad);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink)}
@media print{#lang,.row{display:none}body{background:#fff}.tw,.tot div{border-color:#999}}
</style>
</head>
<body>
<div id="lang"><span>Idioma · Language</span><button type="button" data-l="es">Español</button><button type="button" data-l="en">English</button></div>
<main>
  <p class="eyebrow">Lindsayca Manufacturing USA · <span data-t="Lista de la paleta"></span></p>
  <h1 id="h1"></h1>
  <p class="mut" id="sub"></p>
  <div id="body"></div>
  <div class="row"><button class="btn" type="button" onclick="print()" data-t="Imprimir"></button></div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EN={'Lista de la paleta':'Pallet list','Paleta':'Pallet','Imprimir':'Print','piezas':'pieces','líneas':'lines','Piezas':'Pieces','Líneas':'Lines','Peso (lb)':'Weight (lb)','Superficie (ft²)':'Surface (ft²)',
 'TROQUEL':'STAMP','MARCA':'MARK','CANT.':'QTY.','DESCRIPCIÓN':'DESCRIPTION','LARGO':'LENGTH','SIMPLE/COMPUESTA':'SIMPLE/WELDED','COATING':'COATING','PESO (lb)':'WEIGHT (lb)','SUPERFICIE (ft²)':'SURFACE (ft²)','TOTAL':'TOTAL',
 'Armada':'Packed','Este QR no trae una lista de paleta válida.':'This QR does not contain a valid pallet list.','Abre el visor de la pieza':'Open the piece viewer',
 'Compuesta':'Welded','Simple':'Simple'};
let lang=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='en'?'en':'es';return localStorage.getItem('lang')==='en'?'en':'es'}catch(e){return 'es'}})();
const t=s=>lang==='en'&&EN[s]!=null?EN[s]:s;
let D=null, ERR='';
const fmt=(n,d=0)=>Number(n||0).toLocaleString(lang==='en'?'en-US':'es-US',{maximumFractionDigits:d,minimumFractionDigits:d});
function u8(b){ b=b.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const s=atob(b), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
async function decode(h){ h=h.replace(/^#/,''); if(!h) throw 0; const k=h[0], bytes=u8(h.slice(1)); let txt;
  if(k==='z'){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); txt=await new Response(st).text(); }
  else if(k==='u') txt=new TextDecoder().decode(bytes); else throw 0;
  const d=JSON.parse(txt); if(!d||!Array.isArray(d.r)) throw 0; return d; }
function render(){
  document.documentElement.lang=lang; document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  if(!D){ $('h1').textContent=t('Lista de la paleta'); $('body').innerHTML=`<p class="err">${esc(ERR?t('Este QR no trae una lista de paleta válida.'):'…')}</p>`; return; }
  const n=D.r.reduce((a,r)=>a+(+r[2]||0),0), w=D.r.reduce((a,r)=>a+(+r[5]||0),0), s=D.r.reduce((a,r)=>a+(+r[6]||0),0);
  $('h1').textContent=`${t('Paleta')} ${D.pl||'—'}`; document.title=`${t('Paleta')} ${D.pl||''} · ${D.p||''}`;
  const dt=D.d?new Date(D.d):null;
  $('sub').textContent=[D.p,D.n,dt&&!isNaN(dt)?dt.toLocaleString(lang==='en'?'en-US':'es-US',{dateStyle:'medium',timeStyle:'short'}):''].filter(Boolean).join(' · ');
  const vis=D.p?`../${encodeURIComponent(D.p)}/?lang=${lang}#`:'';
  const tok=x=>String(x??'').trim().replace(/[^A-Za-z0-9._~-]+/g,'_');
  const rows=D.r.map(r=>{ const mk=(D.px||'')+r[1];
    return `<tr><td>${vis?`<a href="${esc(vis+tok(mk)+'~'+tok(r[0]))}" title="${esc(t('Abre el visor de la pieza'))}">${esc(r[0])}</a>`:esc(r[0])}</td><td>${esc(mk)}</td><td class="n">${fmt(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td><td>${esc(t(r[7]||''))}</td><td>${esc(r[8]||'')}</td><td class="n">${fmt(r[5],1)}</td><td class="n">${fmt(r[6],2)}</td></tr>`; }).join('');
  $('body').innerHTML=`<div class="tot"><div><b>${fmt(n)}</b><span>${esc(t('Piezas'))}</span></div><div><b>${fmt(D.r.length)}</b><span>${esc(t('Líneas'))}</span></div><div><b>${fmt(w)}</b><span>${esc(t('Peso (lb)'))}</span></div><div><b>${fmt(s,1)}</b><span>${esc(t('Superficie (ft²)'))}</span></div></div>
   <div class="tw"><table><thead><tr>${['TROQUEL','MARCA','CANT.','DESCRIPCIÓN','LARGO','SIMPLE/COMPUESTA','COATING','PESO (lb)','SUPERFICIE (ft²)'].map((h,i)=>`<th class="${i===2||i>6?'n':''}">${esc(t(h))}</th>`).join('')}</tr></thead>
   <tbody>${rows}</tbody><tfoot><tr><td colspan="2">${esc(t('TOTAL'))}</td><td class="n">${fmt(n)}</td><td colspan="4"></td><td class="n">${fmt(w,1)}</td><td class="n">${fmt(s,2)}</td></tr></tfoot></table></div>`; }
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{ lang=b.dataset.l; try{localStorage.setItem('lang',lang)}catch(e){} render(); });
async function load(){ try{ D=await decode(location.hash); ERR=''; }catch(e){ D=null; ERR='x'; } render(); }
window.addEventListener('hashchange',load); load();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Despacho</title>
<style>
:root{--bg:#eef1f3;--ink:#1d2326;--mut:#5d6a71;--card:#fff;--line:#d5dbdf;--acc:#b5532a;--top:#1d2326;
  --ok:#1e7a46;--okb:#e3f3ea;--warn:#8a5a00;--warnb:#fdf1d6;--bad:#b3261e;--badb:#fbe4e2;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191b;--ink:#e8ecee;--mut:#9aa6ad;--card:#1f2528;--line:#33393d;--acc:#e07a4a;
  --ok:#5cc58a;--okb:#16301f;--warn:#e8b54a;--warnb:#33290f;--bad:#f08078;--badb:#3a1916}}
:root[data-theme="dark"]{--bg:#15191b;--ink:#e8ecee;--mut:#9aa6ad;--card:#1f2528;--line:#33393d;--acc:#e07a4a;--ok:#5cc58a;--okb:#16301f;--warn:#e8b54a;--warnb:#33290f;--bad:#f08078;--badb:#3a1916}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
#lang{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:var(--top)}
#lang span{font:500 12px/1 var(--body);color:#c9d1d4;margin-right:auto}
#lang button{all:unset;cursor:pointer;font:600 14px/1 var(--body);padding:8px 14px;border-radius:999px;color:#fff;border:1px solid #6f7f88}
#lang button[aria-pressed="true"]{background:#fff;color:#1d2326;border-color:#fff}
main{max-width:920px;margin:0 auto;padding:16px}
.eyebrow{font:600 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:4px 0}
h1{font-size:24px;margin:0 0 4px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;font:600 15px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.big{min-height:56px;font-size:17px;flex:1 1 200px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);flex:1 1 200px}
input[type=text]{font:16px var(--body);padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
#gun{font-family:var(--mono)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);padding:10px}
.stat b{display:block;font:700 20px var(--mono)}
.stat span{font-size:12px;color:var(--mut)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
#msg{display:none;padding:14px;border:2px solid;margin:12px 0;font-weight:600}
#msg.ok{display:block;color:var(--ok);background:var(--okb);border-color:var(--ok)}
#msg.warn{display:block;color:var(--warn);background:var(--warnb);border-color:var(--warn)}
#msg.bad{display:block;color:var(--bad);background:var(--badb);border-color:var(--bad)}
#msg small{display:block;font-weight:400;color:var(--ink);margin-top:4px;font-family:var(--mono);word-break:break-all}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;vertical-align:middle}
th{font:600 11px var(--mono);text-transform:uppercase;color:var(--mut);background:var(--bg);position:sticky;top:0}
td.d img{height:56px;width:auto;display:block}
td.q img{width:56px;height:56px;display:block;image-rendering:pixelated}
td .x{all:unset;cursor:pointer;padding:6px 10px;color:var(--bad);font-weight:700}
.st-ok{color:var(--ok);font-weight:700}.st-warn{color:var(--warn);font-weight:700}.st-bad{color:var(--bad);font-weight:700}
#cam{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .bar{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-bottom));background:#111}
#cam .frame{position:absolute;left:50%;top:42%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#camMsg{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));padding:12px;font-weight:700;text-align:center;display:none;color:#fff}
#camMsg.ok{display:block;background:#1e7a46}#camMsg.warn{display:block;background:#8a5a00}#camMsg.bad{display:block;background:#b3261e}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lang"><span>Idioma · Language</span><button type="button" data-l="es">Español</button><button type="button" data-l="en">English</button></div>
<main>
  <p class="eyebrow">Lindsayca Manufacturing USA · <span data-t="Despacho"></span></p>
  <h1 id="title" data-t="Despacho de piezas"></h1>
  <p class="mut" id="sub" data-t="Carga la lista de troquelados del proyecto y escanea los QR de las piezas con la cámara o con la pistola."></p>

  <section class="card" id="loadCard">
    <div class="row">
      <label class="btn pri big" for="file"><span data-t="Cargar lista de troquelados (Excel)"></span></label>
      <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
    </div>
    <p class="mut" id="listInfo" style="margin:10px 0 0"></p>
  </section>

  <section id="work" hidden>
    <div class="card">
      <div class="row">
        <label class="f"><span data-t="Número de paleta"></span><input type="text" id="truck" autocomplete="off"></label>
        <label class="f"><span data-t="Pistola o código (Enter)"></span><input type="text" id="gun" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url"></label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn pri big" id="camBtn" type="button" data-t="Escanear con cámara"></button>
        <button class="btn big" id="xlsBtn" type="button" data-t="Descargar Excel"></button>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="card" id="dlCard" hidden><p style="margin:0 0 10px;font-weight:600" id="dlName"></p><div class="row"><button class="btn pri big" id="shareBtn" type="button" data-t="Compartir o guardar Excel"></button><a class="btn big" id="openBtn" data-t="Abrir Excel"></a></div><p class="mut" style="margin:10px 0 0" data-t="Si no aparece en Descargas, usa «Compartir o guardar Excel» para mandarlo por correo, Teams o WhatsApp, o guardarlo en Archivos o Drive."></p></div>
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="sN">0</b><span data-t="Piezas escaneadas"></span></div>
        <div class="stat"><b id="sL">0 / 0</b><span data-t="Líneas completas"></span></div>
        <div class="stat"><b id="sW">0</b><span data-t="Peso (lb)"></span></div>
        <div class="stat"><b id="sS">0</b><span data-t="Superficie (ft²)"></span></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="undo" type="button" data-t="Deshacer último"></button>
        <button class="btn" id="clear" type="button" data-t="Nuevo despacho"></button>
      </div>
    </div>
    <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <p class="mut" style="margin-top:8px" data-t="Los escaneos se guardan en este teléfono hasta que empieces un nuevo despacho."></p>
  </section>
</main>

<div id="cam" aria-modal="true" role="dialog">
  <video id="vid" playsinline muted></video>
  <div class="frame"></div>
  <div id="camMsg"></div>
  <div class="bar"><button class="btn big" id="camClose" type="button" style="background:#fff;color:#111" data-t="Cerrar cámara"></button></div>
</div>

<script src="lib/jszip.min.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/qrenc.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- idioma ---------- */
const EN={'Despacho':'Shipping','Despacho de piezas':'Piece shipping',
 'Carga la lista de troquelados del proyecto y escanea los QR de las piezas con la cámara o con la pistola.':'Load the project stamp list and scan the piece QR codes with the camera or the scanner gun.',
 'Cargar lista de troquelados (Excel)':'Load stamp list (Excel)','Cambiar lista de troquelados':'Change stamp list',
 'Número de paleta':'Pallet number','NO. PALETA':'PALLET NO.','Paleta':'Pallet','Pistola o código (Enter)':'Scanner gun or code (Enter)',
 'Escanear con cámara':'Scan with camera','Descargar Excel':'Download Excel','Piezas escaneadas':'Pieces scanned','Líneas completas':'Lines complete',
 'Peso (lb)':'Weight (lb)','Superficie (ft²)':'Surface (ft²)','Deshacer último':'Undo last','Nuevo despacho':'New shipment','Tocar otra vez para borrar todo':'Tap again to clear all',
 'Los escaneos se guardan en este teléfono hasta que empieces un nuevo despacho.':'Scans are saved on this phone until you start a new shipment.',
 'Cerrar cámara':'Close camera','OK':'OK','Ya se despacharon todas':'All already shipped','No está en la lista':'Not in the list','Otro proyecto':'Other project',
 'FECHA':'DATE','HORA':'TIME','CAMIÓN / REMISIÓN':'TRUCK / DELIVERY NOTE','ESTADO':'STATUS','QR':'QR','#':'#','DESPACHADO':'SHIPPED','PENDIENTE':'PENDING','HOJA':'SHEET',
 'líneas':'lines','piezas':'pieces','No se encontró una lista de troquelados en ese Excel (hoja con columnas STAMP y MARK).':'No stamp list found in that Excel (sheet with STAMP and MARK columns).',
 'No se pudo abrir la cámara.':'Could not open the camera.','Escaneado':'Scanned','Total despachado':'Total shipped','Proyecto':'Project','Fecha':'Date',
 'Lista':'List','DIBUJO':'DRAWING','Compartir o guardar Excel':'Share or save Excel','Abrir Excel':'Open Excel','Excel listo':'Excel ready','Si no aparece en Descargas, usa «Compartir o guardar Excel» para mandarlo por correo, Teams o WhatsApp, o guardarlo en Archivos o Drive.':'If it does not show up in Downloads, use “Share or save Excel” to send it by email, Teams or WhatsApp, or save it to Files or Drive.','Resumen':'Summary','Cuenta':'Count','línea':'line','de':'of'};
let lang=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q==='en'?'en':'es';return localStorage.getItem('lang')==='en'?'en':'es'}catch(e){return 'es'}})();
const t=s=>lang==='en'&&EN[s]!=null?EN[s]:s;
function paintLang(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));document.title=t('Despacho');render();}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}paintLang();});

/* ---------- estado ---------- */
const tok=s=>String(s??'').trim().replace(/[^A-Za-z0-9._~-]+/g,'_');
const up=s=>tok(s).toUpperCase();
const IMG=new Map();   // dibujos de la lista (se guardan en IndexedDB)
let L=LS.get('desp:list');           // {project,name,file,headers:[...],lines:[{sheet,v:{H:val},mk,st}]}
let S=LS.get('desp:scans')||[];       // [{ts,truck,code,li,status}]
let truck=LS.get('desp:truck')||'';
const save=()=>{LS.set('desp:scans',S);};

/* ---------- leer Excel de troquelados ---------- */
const HDR=[['stamp',/^(STAMP|TROQUEL)/],['sno',/^(S\.?\s*NO|NO\.?$|#)/],['mark',/^(MARK|MARCA)/],['qty',/^(QTY|CANT)/],['desc',/^(DESCRIP)/],
  ['tipo2',/^(SIMPLE|WELDED|COMPU)/],['tipo',/^(TIPO|TYPE)$/],['coat',/^(COATING|GRADE|RECUBR)/],['len',/^(LENGTH|LARGO|LONG)/],['wt',/^(WEIGHT|PESO)/],['sa',/^(SURFACE|SUPERF)/],['dwg',/^(DRAWING|DIBUJO|PLANO|QR)/]];
const kind=h=>{const u=String(h||'').trim().toUpperCase();for(const [k,re] of HDR) if(re.test(u)) return k;return null;};
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const c of m[1]) n=n*26+c.charCodeAt(0)-64;return n-1;}
const tags=(doc,n)=>Array.from(doc.getElementsByTagNameNS('*',n));
const IMGF=new Map();
async function readXlsx(buf){ IMGF.clear();
  const z=await JSZip.loadAsync(buf), P=new DOMParser(), xml=async p=>{const f=z.file(p);return f?P.parseFromString(await f.async('string'),'application/xml'):null;};
  const sst=[]; const ss=await xml('xl/sharedStrings.xml'); if(ss) tags(ss,'si').forEach(si=>sst.push(tags(si,'t').map(x=>x.textContent).join('')));
  const wb=await xml('xl/workbook.xml'), rel=await xml('xl/_rels/workbook.xml.rels'), R={};
  tags(rel,'Relationship').forEach(r=>R[r.getAttribute('Id')]=r.getAttribute('Target'));
  const out=[];
  for(const s of tags(wb,'sheet')){
    const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id');
    let tg=R[rid]||''; tg=tg.replace(/^\/?xl\//,'').replace(/^\//,''); const d=await xml('xl/'+tg); if(!d) continue;
    const rows=[]; let rseq=0; tags(d,'row').forEach(r=>{const ri=r.getAttribute('r')?+r.getAttribute('r')-1:rseq; rseq=ri+1; const row=rows[ri]=[];
      let seq=0; tags(r,'c').forEach(c=>{const ty=c.getAttribute('t'), v=tags(c,'v')[0], rr=c.getAttribute('r'), ci=rr?colIdx(rr):seq; seq=ci+1; let val='';
        if(ty==='s') val=v?sst[+v.textContent]??'':''; else if(ty==='inlineStr') val=tags(c,'t').map(x=>x.textContent).join(''); else if(ty==='b') val=v&&v.textContent==='1';
        else if(ty==='str'||ty==='e') val=v?v.textContent:''; else val=v?(isNaN(+v.textContent)?v.textContent:+v.textContent):'';
        row[ci]=val;});});
    const pics=[]; try{ const sp='xl/'+tg, sr=await xml(sp.replace(/([^/]+)$/,'_rels/$1.rels'));
      if(sr) for(const rr of tags(sr,'Relationship')){ if(!/drawing$/.test(rr.getAttribute('Type'))) continue;
        const dp=new URL(rr.getAttribute('Target'),'http://x/'+sp).pathname.slice(1), dd=await xml(dp), dr=await xml(dp.replace(/([^/]+)$/,'_rels/$1.rels')); if(!dd||!dr) continue; const M={};
        tags(dr,'Relationship').forEach(x=>M[x.getAttribute('Id')]=new URL(x.getAttribute('Target'),'http://x/'+dp).pathname.slice(1));
        for(const an of [...tags(dd,'oneCellAnchor'),...tags(dd,'twoCellAnchor')]){ const fr=tags(an,'from')[0], bl=tags(an,'blip')[0], ex=tags(an,'ext')[0]; if(!fr||!bl) continue;
          const emb=bl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed')||bl.getAttribute('r:embed'), mp=M[emb]; if(!mp||!z.file(mp)) continue;
          pics.push({row:+tags(fr,'row')[0].textContent,col:+tags(fr,'col')[0].textContent,path:mp,cx:ex?+ex.getAttribute('cx'):0,cy:ex?+ex.getAttribute('cy'):0}); } } }catch(e){ console.warn('dibujos',e); }
    for(const pc of pics){ if(!IMGF.has(pc.path)) IMGF.set(pc.path,await z.file(pc.path).async('base64')); }
    out.push({name:s.getAttribute('name'),rows,pics});}
  return out;}
function parseList(sheets,file){ IMG.clear();
  let project='',name='',headers=null; const lines=[];
  sheets.forEach(sh=>{
    sh.rows.slice(0,6).forEach(r=>(r||[]).forEach(v=>{const m=/\b(US\.?\d{3}(?:\.\d+)?)\b/i.exec(String(v||''));if(m&&!project) project=m[1].toUpperCase().replace(/^US(\d)/,'US.$1');
      const n=/^(.*?)\s+[—-]\s+(LISTA DE TROQUELADOS|STAMP LIST)/i.exec(String(v||''));if(n&&!name) name=n[1].trim();}));
    let hi=-1,map=null;
    for(let i=0;i<Math.min(sh.rows.length,15);i++){const r=sh.rows[i]||[];const ks=r.map(kind);if(ks.includes('mark')&&ks.includes('stamp')&&ks.includes('qty')){hi=i;map=r;break;}}
    if(hi<0) return;
    const H=map.map((h,ci)=>({h:String(h??'').trim(),k:kind(h),ci})).filter(x=>x.h&&x.k!=='dwg');
    if(!headers) headers=H.map(x=>x.h);
    for(let i=hi+1;i<sh.rows.length;i++){const r=sh.rows[i]||[];const g=k=>{const x=H.find(y=>y.k===k);return x?r[x.ci]:'';};
      const mk=g('mark'); if(mk===''||mk==null){ if(String(r[0]??'').toUpperCase().startsWith('TOTAL')) break; continue; }
      if(r.some(c=>/^\s*TOTAL\b/i.test(String(c??'')))) continue;
      const v={}; H.forEach(x=>{ const target=headers.find(h=>kind(h)===x.k&&x.k)||x.h; v[target]=r[x.ci]??''; if(!headers.includes(target)) headers.push(target); });
      const dc=map.findIndex(h=>kind(h)==='dwg'&&/^(DRAWING|DIBUJO|PLANO)/i.test(String(h||'').trim())), pc=(sh.pics||[]).find(x=>x.row===i&&(dc<0?true:x.col===dc));
      let img=null; if(pc){ img='i'+IMG.size; const b64=IMGF.get(pc.path); IMG.set(img,{ext:/\.jpe?g$/i.test(pc.path)?'jpeg':'png',b64,cx:pc.cx||800100,cy:pc.cy||457200}); }
      const q=+g('qty'); lines.push({sheet:sh.name,v,mk:up(mk),st:up(g('stamp')),qty:isFinite(q)&&q>0?q:1,wt:+g('wt')||0,sa:+g('sa')||0,img});}
  });
  if(!lines.length) return null;
  return {project,name,file,headers,lines};}

const IDB={db:null,open(){ return this.db||(this.db=new Promise((ok,ko)=>{ try{ const r=indexedDB.open('despacho',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }catch(e){ ko(e); } })); },
  async put(k,v){ try{ const d=await this.open(); await new Promise((ok,ko)=>{ const tx=d.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=ok; tx.onerror=()=>ko(tx.error); }); }catch(e){ console.warn('idb',e); } },
  async get(k){ try{ const d=await this.open(); return await new Promise((ok,ko)=>{ const r=d.transaction('kv').objectStore('kv').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }catch(e){ return null; } }};
$('file').onchange=async e=>{const f=e.target.files[0]; if(!f) return; e.target.value='';
  try{ const sh=await readXlsx(await f.arrayBuffer()); const l=parseList(sh,f.name); if(!l){ show('bad',t('No se encontró una lista de troquelados en ese Excel (hoja con columnas STAMP y MARK).')); return; }
    if(L&&S.length&&L.project!==l.project){ S=[]; save(); }
    L=l; LS.set('desp:list',L); IDB.put('imgs',[...IMG.entries()]);
    const old=S; S=[]; old.forEach(x=>{ const q=parse(x.code); let li=-1, st;
      if(q.proj&&L.project&&q.proj!==L.project) st='bad-proj'; else { li=find(q); st=li<0?'bad':(shipped(li)>=L.lines[li].qty?'warn':'ok'); }
      S.push({...x,li,status:st}); }); save(); render(); $('gun').focus();
  }catch(err){ console.error(err); show('bad',String(err.message||err)); }};

/* ---------- escanear ---------- */
function parse(code){ code=String(code||'').trim(); const h=code.indexOf('#'); const body=h>=0?code.slice(h+1):code;
  let proj=''; const m=/\/(US\.\d{3}(?:\.\d+)?)\//i.exec(code); if(m) proj=m[1].toUpperCase();
  const p=decodeURIComponent(body.replace(/\+/g,' ')).split('~'); return {proj,mk:up(p[0]||''),st:up(p[1]||''),unit:p[2]||''}; }
const shipped=li=>S.filter(s=>s.li===li).length;
function find(p){ if(!L) return -1; const idx=[]; L.lines.forEach((l,i)=>{ if(l.mk===p.mk&&(!p.st||l.st===p.st)) idx.push(i); });
  if(!idx.length&&p.st) L.lines.forEach((l,i)=>{ if(l.st===p.st&&!idx.includes(i)) idx.push(i); });
  if(!idx.length) L.lines.forEach((l,i)=>{ if(l.mk===p.mk) idx.push(i); });
  if(!idx.length) return -1; return idx.find(i=>shipped(i)<L.lines[i].qty)??idx[0]; }
let lastCode='',lastAt=0;
function scan(code,fromCam){
  code=String(code||'').trim(); if(!code||!L) return null; const now=Date.now();
  if(fromCam&&code===lastCode&&now-lastAt<2500) return null; lastCode=code; lastAt=now;
  const p=parse(code); let li=-1, status;
  if(p.proj&&L.project&&p.proj!==L.project) status='bad-proj'; else { li=find(p); status=li<0?'bad':(shipped(li)>=L.lines[li].qty?'warn':'ok'); }
  S.push({ts:now,truck,code,li,status}); save(); render();

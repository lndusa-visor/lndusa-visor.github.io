   <p class="note" style="margin:0 0 12px">El piperack (30 m, 55 m…) sale solo del nombre del modelo de Tekla${rackOf(DATA.project)?`: <b>${esc(rackOf(DATA.project))}</b>`:''}.</p>

  const keys=Object.keys(DICT).sort((a,b)=>b.length-a.length);
  const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const W=/[A-Za-z0-9_À-ɏ]/, WC='A-Za-z0-9_À-ɏ';
  let RE, LB=true;
  try{ RE=new RegExp(keys.map(k=>(W.test(k[0])?'(?<!['+WC+'])':'')+esc(k)+(W.test(k[k.length-1])?'(?!['+WC+'])':'')).join('|'),'g'); }
  catch(e){ LB=false; RE=new RegExp(keys.map(esc).join('|'),'g'); }
  const memo=new Map();
  let lang='en'; try{ const q=new URLSearchParams(location.search).get('lang'), s=localStorage.getItem('lang'); lang=q?(q==='es'?'es':'en'):(s==='es'?'es':'en'); }catch(e){}
  function tr(s){
    if(lang!=='en'||typeof s!=='string'||!s||!/[A-Za-zÀ-ɏ]/.test(s)) return s;
    const m=memo.get(s); if(m!==undefined) return m;
    const out=s.replace(RE,(k,off,str)=>{ if(!LB){ const a=str[off-1], b=str[off+k.length];
      if(W.test(k[0])&&a&&W.test(a)) return k; if(W.test(k[k.length-1])&&b&&W.test(b)) return k; } return DICT[k]; });
    if(memo.size<20000) memo.set(s,out); return out; }
  // ---- pantalla ----
  const orig=new WeakMap(), shown=new WeakMap(), ATTR=['placeholder','title','aria-label','alt'];
  const skip=n=>{ const p=n.parentNode; return !p||/^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/.test(p.nodeName)||(p.closest&&p.closest('[data-noi18n]')); };
  function doText(n){ if(skip(n)) return; const cur=n.data;
    if(shown.get(n)!==cur) orig.set(n,cur);
    const o=orig.get(n); const v=lang==='en'?tr(o):o; if(v!==cur) n.data=v; shown.set(n,n.data); }
  function doEl(el){ if(!el.getAttribute||(el.closest&&el.closest('[data-noi18n]'))) return;
    ATTR.forEach(a=>{ if(!el.hasAttribute(a)) return; const cur=el.getAttribute(a), k='__i18n_'+a;
      if(el[k+'s']!==cur) el[k]=cur; const v=lang==='en'?tr(el[k]):el[k]; if(v!==cur) el.setAttribute(a,v); el[k+'s']=el.getAttribute(a); }); }
  function walk(root){ if(!root) return;
    if(root.nodeType===3){ doText(root); return; }
    if(root.nodeType===1){ doEl(root); if(root.shadowRoot) walk(root.shadowRoot); }
    const it=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
    let n; while((n=it.nextNode())){ if(n.nodeType===3) doText(n); else { doEl(n); if(n.shadowRoot){ walk(n.shadowRoot); watch(n.shadowRoot); } } } }
  const watched=new WeakSet();
  function watch(root){ if(watched.has(root)) return; watched.add(root);
    new MutationObserver(ms=>{ ms.forEach(m=>{ if(m.type==='characterData') doText(m.target); else if(m.type==='attributes') doEl(m.target); else m.addedNodes.forEach(walk); }); })
      .observe(root,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTR}); }
  let titleO=null;
  function doTitle(){ const t=document.title; if(titleO===null||(t!==tr(titleO)&&t!==titleO)) titleO=t; const v=lang==='en'?tr(titleO):titleO; if(v!==t) document.title=v; }
  // ---- Excel: hojas, textos y nombres en inglés al escribir ----
  const sheetMap={};
  function trWb(wb){ if(lang!=='en'||!wb||!wb.SheetNames) return;
    const used=new Set(), ren={};
    wb.SheetNames.forEach(o=>{ let t=tr(o).replace(/[\[\]:*?\/\\]/g,'-').slice(0,31); let b=t,i=2; while(used.has(t.toUpperCase())){ t=(b.slice(0,28)+' '+i++); } used.add(t.toUpperCase()); ren[o]=t; });
    const S={}; wb.SheetNames.forEach(o=>{ const ws=wb.Sheets[o]; if(ws) Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const c=ws[k]; if(c&&c.t==='s'&&typeof c.v==='string'){ c.v=tr(c.v); delete c.w; delete c.h; delete c.r; }
        if(c&&typeof c.f==='string') Object.keys(ren).forEach(x=>{ if(ren[x]!==x) c.f=c.f.split("'"+x+"'!").join("'"+ren[x]+"'!"); }); });
      S[ren[o]]=ws; sheetMap[ren[o]]=o; });
    wb.SheetNames=wb.SheetNames.map(o=>ren[o]); wb.Sheets=S;
    if(wb.Workbook&&wb.Workbook.Sheets) wb.Workbook.Sheets.forEach(s=>{ if(s&&ren[s.name]) s.name=ren[s.name]; });
    if(wb.Workbook&&wb.Workbook.Names) wb.Workbook.Names.forEach(n=>{ if(n&&typeof n.Ref==='string') Object.keys(ren).forEach(x=>{ if(ren[x]!==x) n.Ref=n.Ref.split("'"+x+"'!").join("'"+ren[x]+"'!"); }); }); }
  function hookX(){ const X=window.XLSX; if(!X||X.__i18n) return !!X; X.__i18n=true;
    ['write','writeFile','writeFileXLSX'].forEach(f=>{ const o=X[f]; if(typeof o==='function') X[f]=function(wb,...a){ try{ trWb(wb); }catch(e){ console.warn('i18n excel',e); } return o.call(this,wb,...a); }; });
    return true; }

  function aliasRid(rid,xe){ Object.keys(sheetMap).forEach(t=>{ const k=xe?xe(t):t, o=xe?xe(sheetMap[t]):sheetMap[t]; if(rid[k]&&!rid[o]) rid[o]=rid[k]; }); }
